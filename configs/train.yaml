project: sp-edge-train
# Conjunto pré-declarado; não trocar após observar resultados.
seeds: [0, 1, 2, 67]

# ---------- Dataset ----------
# VisDrone ORIGINAL, 10 classes (pedestrian, people, bicycle, car, van,
# truck, tricycle, awning-tricycle, bus, motor).
#
# O caminho científico inteiro usa as 10 classes originais do VisDrone.
# Baselines exploratórios com remapeamento COCO não fazem parte do estudo.
dataset:
  # Dataset YOLO original; pode ser trocado por outro data.yaml compatível.
  base_yaml: /data/datasets/VisDrone.yaml

# ---------- Modelos a treinar ----------
models:
  - {name: yolo11n, weights: yolo11n.pt}
  - {name: yolo11s, weights: yolo11s.pt}
  - {name: yolov10n, weights: yolov10n.pt}

# ---------- Hiperparâmetros (dimensionados para RTX 5070, 12 GB VRAM / 32 GB RAM) ----------
train:
  imgsz: 640
  epochs: 100
  batch: 16
  workers: 8
  amp: true
  cache: disk   # 'ram' estoura os 32 GB com o VisDrone inteiro; 'disk' é o meio-termo seguro
  max_det: 1000 # default do Ultralytics é 300; há imagem de treino com 902 objetos anotados
  device: 0
  deterministic: true

# ---------- Modo --smoke: validar o pipeline no PC local antes de subir ao servidor ----------
smoke:
  epochs: 2
  imgsz: 320
  batch: 4
  workers: 2
  cache: false
  fraction: 0.05   # poucas imagens do split de treino, só para checar que o loop roda
  device: cpu
  seeds: [0]
