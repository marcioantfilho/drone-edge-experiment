project: sp-edge-train
seed: 0

# ---------- Dataset ----------
# VisDrone ORIGINAL, 10 classes (pedestrian, people, bicycle, car, van,
# truck, tricycle, awning-tricycle, bus, motor).
#
# Isto é DIFERENTE do VisDroneCOCO.yaml usado em configs/experiment.yaml.
# Aquele remapeamento para as classes do COCO é uma muleta que só serve
# para avaliar pesos pré-treinados (yolo11n.pt etc.) sem fine-tuning --
# o vocabulário do COCO não tem "tricycle" nem "awning-tricycle", então o
# baseline zero-shot precisa colapsar classes para caber no que o modelo
# já conhece. Aqui não: o modelo aprende a taxonomia real do VisDrone.
dataset:
  # CAMINHO ABSOLUTO, sempre. Um nome de hub bare ("VisDrone.yaml") resolve
  # para o yaml embutido no pacote Ultralytics, cujo 'path' aponta para o
  # dataset completo (train/val/test, ~2 GB) e dispara download automático
  # em outro lugar -- não necessariamente /data/datasets. O arquivo em
  # /data/datasets/VisDrone.yaml já existe no volume montado e é o que os
  # outros scripts do projeto usam como referência.
  base_yaml: /data/datasets/VisDrone.yaml

# ---------- Modelos a treinar ----------
models:
  - {name: yolo11n, weights: yolo11n.pt}
  - {name: yolo11s, weights: yolo11s.pt}
  - {name: yolov10n, weights: yolov10n.pt}

# ---------- Hiperparâmetros (dimensionados para RTX 5070, 12 GB VRAM / 32 GB RAM) ----------
train:
  imgsz: 640
  epochs: 100
  batch: 16
  workers: 8
  amp: true
  cache: disk   # 'ram' estoura os 32 GB com o VisDrone inteiro; 'disk' é o meio-termo seguro
  max_det: 1000 # default do Ultralytics é 300; há imagem de treino com 902 objetos anotados
  device: 0

# ---------- Modo --smoke: validar o pipeline no PC local antes de subir ao servidor ----------
smoke:
  epochs: 2
  imgsz: 320
  batch: 4
  workers: 2
  cache: false
  fraction: 0.05   # poucas imagens do split de treino, só para checar que o loop roda
  device: cpu
